#100 eV H in W
[options]
name = "rustbca_output/100eV_H_in_W_"
track_trajectories = false
track_recoils = false
track_recoil_trajectories = false
write_buffer_size = 8000
weak_collision_order = 3
suppress_deep_recoils = false
high_energy_free_flight_paths = false
electronic_stopping_mode = "INTERPOLATED"
mean_free_path_model = "LIQUID"
interaction_potential = [["KR_C"]]
scattering_integral = [["MENDENHALL_WELLER"]]
use_hdf5 = false
root_finder = [[{"NEWTON"={max_iterations=100, tolerance=1E-6}}]]
num_threads = 8
num_chunks = 10
track_displacements = false
track_energy_losses = false


[particle_parameters]
length_unit = "1e-6"
energy_unit = "EV"
mass_unit = "AMU"
N = [ 1000,]
m = [ 1.008,]
Z = [ 1,]
E = [ 100,]
Ec = [ 1.0,]
Es = [ 0.0,]
interaction_index = [0]
pos = [ [ -1.7453292519934434e-8, 0.0, 0.0,],]
dir = [ [ 0.999, 0.001, 0.0,],]

[geometry_input]
length_unit = "MICRON"
densities = [ [ 5.664e+10, 0.0 ], [ 0.0, 6.322e+10 ] ]
layer_thicknesses = [0.0001, 50]
electronic_stopping_correction_factors = [1.0, 1.0]


[material_parameters] 
#Ti W 
# Eb_W from https://doi.org/10.1016/j.jnucmat.2017.08.019
# Es_W from https://doi.org/10.1016/j.apsusc.2013.12.129
# Eb_Ti assumed zero
# Es_Ti from Chase, M.W., Jr., NIST-JANAF Themochemical Tables, Fourth Edition, J. Phys. Chem. Ref. Data, Monograph 9, 1998, 1-195
energy_unit = "EV"
mass_unit = "AMU"
Eb = [ 3, 3 ]
Es = [ 4.89, 8.68 ]
Ec = [ 3.5, 1.0 ]
Ed = [25, 25]
Z = [ 22, 74 ]
m = [ 47.867, 183.84 ]
interaction_index = [0, 0 ]
surface_binding_model = {"PLANAR"={calculation="TARGET"}}
bulk_binding_model = "AVERAGE"